# Publica la web (raíz) y la app (/app/) en GitHub Pages cada vez que cambia main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Dirección: https://polykat-franui.github.io/  (app: …/app/)
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
