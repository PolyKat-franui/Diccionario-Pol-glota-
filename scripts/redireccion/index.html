<!doctype html>
<!-- Página para la dirección antigua (franciscasanhueza.github.io/Diccionario-Pol-glota-/).
     Lleva a la nueva y, si es la app, se lleva el avance guardado en este navegador.
     Va también como 404.html, así cualquier ruta antigua redirige. Cambia NUEVA si cambia la dirección. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Franui se mudó</title>
<style>
  :root { --bg: #FBF6F3; --ink: #2A1715; --enlace: #9E2A3A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1E1413; --ink: #F5E4E0; --enlace: #F7D5DC; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  a { color: var(--enlace); font-weight: 700; display: inline-block; min-height: 44px; padding: 10px; }
</style>
</head>
<body>
<main>
  <p>🌸 Franui · Polykat se mudó a una nueva dirección.</p>
  <p><a id="ir" href="https://franui.github.io/">Ir a Franui</a></p>
</main>
<script>
  const NUEVA = 'https://franui.github.io';
  const BASE = '/Diccionario-Pol-glota-';
  let ruta = location.pathname.startsWith(BASE) ? location.pathname.slice(BASE.length) : '/';
  if (!ruta.startsWith('/')) ruta = '/' + ruta;
  let destino = NUEVA + ruta + location.search + location.hash;
  try {
    const avance = localStorage.getItem('franui:v1');
    if (ruta.startsWith('/app') && avance) {
      const bytes = new TextEncoder().encode(avance);
      let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
      const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      destino = NUEVA + (ruta.endsWith('/') ? ruta : '/app/') + '#traspaso=' + b64;
    }
  } catch (e) { /* sin acceso al avance: solo redirige */ }
  document.getElementById('ir').href = destino;
  location.replace(destino);
</script>
</body>
</html>
