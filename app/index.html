<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polyglok</title>
  <meta name="description" content="Aprende el vocabulario y las frases cotidianas de varios idiomas a la vez, deslizando tarjetas.">
  <meta name="theme-color" content="#E4E2DA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211A18" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/corazon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans:wght@400&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/logo.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="adornos" id="adornos" aria-hidden="true"></div>
  <a class="saltar" href="#vista">Ir al contenido</a>

  <header class="barra" id="barra" hidden>
    <a class="marca" href="#/aprender" aria-label="Polyglok">
      <span class="logo"><span class="logo-a">Polyglok</span> <span class="logo-b">in progress</span></span>
    </a>
    <nav class="nav-sup" id="nav-sup" aria-label="Secciones"></nav>
    <div class="barra-der">
      <a class="chip chip-racha" href="#/ranking" id="chip-racha"><img src="assets/sakura.svg" alt="" width="23" height="23"><span></span></a>
      <span class="chip chip-tokens" id="chip-tokens"><img class="moneda" src="assets/moneda.svg" alt="" width="24" height="24"><span></span></span>
      <button class="chip chip-nativo" type="button" id="btn-nativo" aria-haspopup="dialog"></button>
      <a class="avatar" href="#/ajustes" id="avatar"></a>
      <a class="icon-btn" href="#/ajustes" id="btn-ajustes"></a>
    </div>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Secciones" hidden></nav>

  <button class="kitty-fab" id="kitty-fab" type="button" hidden>
    <img src="assets/caras/feliz.svg" alt="" width="60" height="48">
  </button>

  <dialog class="kitty-panel" id="kitty-panel" aria-labelledby="kitty-titulo">
    <header>
      <img class="kitty-cara" id="kitty-cara" src="assets/caras/feliz.svg" alt="" width="40" height="32">
      <div><h2 id="kitty-titulo">Kitty</h2><p class="suave" id="kitty-modo"></p></div>
      <button class="icon-btn" type="button" id="kitty-cerrar"></button>
    </header>
    <div class="kitty-msgs" id="kitty-msgs" aria-live="polite"></div>
    <div class="kitty-rapidas" id="kitty-rapidas"></div>
    <form class="kitty-form" id="kitty-form">
      <input id="kitty-input" autocomplete="off" maxlength="120">
      <button class="icon-btn primario" type="submit" id="kitty-enviar"></button>
    </form>
  </dialog>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo">
    <h2 id="modal-titulo"></h2>
    <div id="modal-cuerpo"></div>
    <form method="dialog"><button class="btn" id="modal-cerrar"></button></form>
  </dialog>

  <div class="brillo" id="capa-brillo" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="arana-capa" id="capa-idiomas" role="dialog" aria-modal="true" aria-labelledby="capa-idiomas-titulo" hidden></div>
  <div class="tutorial-capa" id="tutorial" hidden></div>

  <noscript>Polyglok necesita JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
